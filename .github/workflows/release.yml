# Custom Release Workflow
# Publishes provider package to ghcr.io using simplified Docker + XPKG approach
name: Release (Official Workflows)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Init build submodule
        run: git submodule update --init --depth 1 build

      - name: Authorize Release
        run: |
          set -e
          ACTOR="${{ github.actor }}"
          OWNER="${{ github.repository_owner }}"
          if [[ "$ACTOR" != "$OWNER" ]]; then
            echo "❌ Refusing release: actor '$ACTOR' is not repository owner '$OWNER'"
            exit 1
          fi
          echo "✅ Release authorized for $ACTOR"

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Validate Version
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version '$VERSION'. Must match ^v[0-9]+.[0-9]+.[0-9]+$ (e.g. v1.2.3)."
            exit 1
          fi
          echo "✅ Valid version: $VERSION"

      - name: Sync Package Metadata
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          PACKAGE_NAME=$(basename ${{ github.repository }})
          CONTROLLER_IMAGE="${REGISTRY}/${PACKAGE_NAME}:${VERSION}"

          # Point the package metadata at the image we are about to publish.
          # This runs before the Docker image build so the package.yaml embedded
          # in the controller image, and the xpkg built later, both reference the
          # real pullable image instead of a stale/placeholder tag.
          sed -i "s|^\( *image:\).*|\1 ${CONTROLLER_IMAGE}|" package/crossplane.yaml
          grep -n "image:" package/crossplane.yaml

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Artifacts
        run: |
          set -e
          export VERSION="${{ steps.version.outputs.version }}"
          export BRANCH_NAME="master"
          
          # Build Go binaries, Docker image, and XPKG package
          make build.all build.artifacts

      - name: Push Docker Image
        run: |
          set -e
          export VERSION="${{ steps.version.outputs.version }}"
          export REGISTRY="ghcr.io/${{ github.repository_owner }}"

          # Extract package name from repository
          PACKAGE_NAME=$(basename ${{ github.repository }})

          echo "Pushing multi-arch Docker image to ${REGISTRY}/${PACKAGE_NAME}:${VERSION}"

          # Stage build context for the multi-arch Dockerfile.
          # `make build.all build.artifacts` writes binaries to _output/bin/<os>_<arch>/provider,
          # but cluster/images/<image>/Dockerfile expects bin/<os>_<arch>/provider at the
          # build-context root. Mirror _output/bin into ./bin so docker buildx finds it.
          rm -rf bin
          cp -r _output/bin bin

          # The Dockerfile also expects package.yaml at the build-context root.
          # The authoritative metadata now lives at package/crossplane.yaml; stage it as
          # package.yaml so the multi-arch image embeds the same metadata the xpkg uses.
          cp package/crossplane.yaml package.yaml

          # Push Docker image directly for multi-arch from repo root
          docker buildx build \
            --push \
            --tag "${REGISTRY}/${PACKAGE_NAME}:${VERSION}" \
            --tag "${REGISTRY}/${PACKAGE_NAME}:latest" \
            --platform linux/amd64,linux/arm64 \
            --file ./cluster/images/*/Dockerfile \
            .

      - name: Install Crossplane CLI and Publish XPKG
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          PACKAGE_NAME=$(basename ${{ github.repository }})
          CONTROLLER_IMAGE="${REGISTRY}/${PACKAGE_NAME}:${VERSION}"
          
          echo "Installing Crossplane CLI and publishing XPKG"
          go install github.com/crossplane/crossplane/cmd/crank@latest

          # The xpkg produced by `make build.all build.artifacts` embeds the
          # per-host build-registry image (BUILD_REGISTRY=build-<hash>/...),
          # which is never pushed and cannot be pulled after the build. Rebuild
          # the package embedding the real OCI image we published to ghcr.io so
          # Crossplane can run the provider from the released package.
          # `--embed-runtime-image` loads the image from the local Docker daemon,
          # so pull the published image first.
          docker pull "${CONTROLLER_IMAGE}"

          $(go env GOPATH)/bin/crank xpkg build \
            --embed-runtime-image "${CONTROLLER_IMAGE}" \
            --package-root package \
            --examples-root examples \
            --package-file _output/xpkg/linux_amd64/${PACKAGE_NAME}-${VERSION}.xpkg

          $(go env GOPATH)/bin/crank xpkg push \
            --package-files _output/xpkg/linux_amd64/${PACKAGE_NAME}-${VERSION}.xpkg \
            ${REGISTRY}/${PACKAGE_NAME}:${VERSION}

      - name: Verify Publication
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          REGISTRY_PATH="ghcr.io/${{ github.repository_owner }}/$(basename ${{ github.repository }})"
          
          echo "Verifying publication to ${REGISTRY_PATH}:${VERSION}"
          if docker pull "${REGISTRY_PATH}:${VERSION}" > /dev/null 2>&1; then
            DIGEST=$(docker inspect "${REGISTRY_PATH}:${VERSION}" --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
            echo "✅ Verified package ${VERSION} (${DIGEST})"
          else
            echo "❌ Failed to pull package ${VERSION}"
            exit 1
          fi

      - name: Upload XPKG Artifact
        uses: actions/upload-artifact@v7
        with:
          name: xpkg
          path: _output/xpkg/linux_amd64/${{ github.event.repository.name }}-${{ steps.version.outputs.version }}.xpkg

  publish:
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      contents: write

    steps:
      - name: Use Released Version
        id: version
        run: |
          # Reuse the version validated and gated by the release job instead of
          # re-reading the raw workflow_dispatch input here.
          VERSION="${{ needs.release.outputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Released version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ github.event.repository.name }} ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
