# Standardized Release Workflow for Crossplane Providers
# Version: 2026-08-09 - Adapted from provider-keycloak template
#
# This workflow handles ALL publishing for releases
# - Only runs on version tag creation to avoid conflicts with CI
# - Builds from source using Crossplane makelib and publishes to registry
# - Verifies successful publication to registry
# - Creates GitHub release with auto-generated notes
# - Single source of truth for version and latest tags
#
# Key features:
# - Uses github.token for OIDC registry authentication
# - Single job orchestration for clear sequencing
# - Built-in publication verification (version + latest tags)
# - Supports manual workflow_dispatch for recovery scenarios

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  GO_VERSION: '1.26.5'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vendor Dependencies
        run: go mod vendor

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Build Tools
        run: make build.init

      - name: Build Binary and Images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          export VERSION="${{ steps.version.outputs.version }}"
          make build.code build.artifacts PLATFORMS=linux_amd64,linux_arm64

      - name: Publish Artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          export VERSION="${{ steps.version.outputs.version }}"
          make publish.artifacts \
            REGISTRY_ORGS="ghcr.io/${{ github.repository_owner }}" \
            XPKG_REG_ORGS="ghcr.io/${{ github.repository_owner }}" \
            PLATFORMS=linux_amd64,linux_arm64 \
            BRANCH_NAME=master

          echo "✅ Published to ghcr.io/${{ github.repository_owner }}"

      - name: Verify Publication
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"
          PROVIDER_NAME="${{ github.event.repository.name }}"
          REGISTRY_PATH="ghcr.io/${{ github.repository_owner }}/${PROVIDER_NAME}"

          echo "Verifying container image publication..."
          echo "Registry: ${REGISTRY_PATH}"

          # Verify version tag exists and is pullable
          if docker pull "${REGISTRY_PATH}:${VERSION}" > /dev/null 2>&1; then
            echo "✅ Verified container image ${VERSION}"
          else
            echo "❌ Failed to pull container image ${VERSION}"
            exit 1
          fi

          # Get digest for verification
          VERSION_DIGEST=$(docker inspect "${REGISTRY_PATH}:${VERSION}" --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
          echo "✅ Image digest: ${VERSION_DIGEST}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
