default: true

# MD013: Line length
MD013:
  line_length: 120
  code_blocks: false
  tables: false
  headings: false

# MD024: Allow duplicate headings (common in changelog: each version section
# has "### Features", "### Fixes", "### Migration Notes", etc.)
MD024: false

# MD033: Allow inline HTML
MD033: false

# MD041: First line in file should be a top level heading
MD041: false
