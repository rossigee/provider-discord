---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: deduplications.deduplication.discord.crossplane.io
spec:
  group: deduplication.discord.crossplane.io
  names:
    categories:
    - crossplane
    - provider
    - discord
    kind: Deduplication
    listKind: DeduplicationList
    plural: deduplications
    singular: deduplication
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: PHASE
      type: string
    - jsonPath: .spec.mode
      name: MODE
      type: string
    - jsonPath: .status.summary.totalDuplicateChannelsFound
      name: DUPLICATES-FOUND
      type: integer
    - jsonPath: .status.summary.channelsDeleted
      name: DELETED
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A Deduplication tracks a channel deduplication operation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A DeduplicationSpec defines the desired state of a Deduplication
              operation.
            properties:
              deleteOrphanedResources:
                description: |-
                  DeleteOrphanedResources indicates whether to delete Crossplane resources
                  for deleted Discord channels.
                type: boolean
              mode:
                description: Mode defines the deduplication behavior that was requested.
                enum:
                - report
                - action
                type: string
              providerConfigRef:
                description: ProviderConfigRef references the ProviderConfig that
                  triggered this deduplication.
                properties:
                  name:
                    description: Name of the ProviderConfig.
                    type: string
                required:
                - name
                type: object
              targetGuilds:
                description: |-
                  TargetGuilds limits deduplication to specific guild IDs.
                  If empty, all guilds were processed.
                items:
                  type: string
                type: array
            required:
            - mode
            - providerConfigRef
            type: object
          status:
            description: A DeduplicationStatus reflects the observed state of a Deduplication
              operation.
            properties:
              completionTime:
                description: CompletionTime is when the deduplication operation completed.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the deduplication's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastError:
                description: LastError describes the last error encountered during
                  deduplication (if any).
                type: string
              phase:
                description: Phase indicates the current phase of the deduplication
                  operation.
                enum:
                - pending
                - analyzing
                - completed
                - failed
                type: string
              results:
                additionalProperties:
                  description: GuildDeduplicationResult contains deduplication results
                    for a specific guild.
                  properties:
                    channelsDeleted:
                      description: ChannelsDeleted is the count of channels deleted
                        in this guild (action mode only).
                      type: integer
                    duplicateGroups:
                      description: DuplicateGroups contains information about each
                        duplicate channel group found.
                      items:
                        description: |-
                          DuplicateGroupInfo contains information about a group of duplicate channels.

                          Keep-selection for channels is message-history-based: a channel is only ever kept if
                          it has real message history, or - only when every channel in the group is empty - as
                          a last-resort tie-breaker by earliest creation. KeptChannelIDs can therefore contain
                          more than one ID; when it does, NeedsManualReview is set and only the zero-message
                          channels in DeletedChannelIDs were (or would be) auto-deleted.
                        properties:
                          channelName:
                            description: ChannelName is the name shared by all channels
                              in this group.
                            type: string
                          count:
                            description: Count is the number of duplicate channels
                              with this name.
                            type: integer
                          deletedChannelIds:
                            description: DeletedChannelIDs are the IDs of channels
                              that were (or, in report mode, would be) deleted.
                            items:
                              type: string
                            type: array
                          keptChannelIds:
                            description: |-
                              KeptChannelIDs are the IDs of channels that were kept (not deleted). Normally a
                              single ID; more than one means multiple channels in this group had real message
                              history - see NeedsManualReview.
                            items:
                              type: string
                            type: array
                          messageCounts:
                            description: |-
                              MessageCounts are the sampled message-history counts (capped at 100) for each
                              channel in this group, in the same order the channels were discovered. Zero means
                              no messages found; a channel with a non-zero count here is never auto-deleted.
                            items:
                              type: integer
                            type: array
                          needsManualReview:
                            description: |-
                              NeedsManualReview is true when more than one channel in this group has message
                              history, so keep-selection could not be resolved automatically - only the
                              zero-message channels were auto-deleted, and the remaining KeptChannelIDs need a
                              human to decide which (if any) should be removed.
                            type: boolean
                        required:
                        - channelName
                        - count
                        type: object
                      type: array
                    errors:
                      description: Errors contains any errors encountered while processing
                        this guild.
                      items:
                        type: string
                      type: array
                    guildId:
                      description: GuildID is the Discord guild ID.
                      type: string
                    guildName:
                      description: GuildName is the Discord guild name.
                      type: string
                    orphanedResourcesDeleted:
                      description: OrphanedResourcesDeleted is the count of resources
                        deleted in this guild (action mode only).
                      type: integer
                    roleDuplicateGroups:
                      description: RoleDuplicateGroups contains information about
                        each duplicate role group found.
                      items:
                        description: |-
                          RoleDuplicateGroupInfo contains information about a group of duplicate roles.
                          Roles have no message-history concept, so keep-selection is always the earliest-created
                          (lowest Discord snowflake ID) role - exactly one KeptRoleID.
                        properties:
                          count:
                            description: Count is the number of duplicate roles with
                              this name.
                            type: integer
                          deletedRoleIds:
                            description: DeletedRoleIDs are the IDs of roles that
                              were (or, in report mode, would be) deleted.
                            items:
                              type: string
                            type: array
                          keptRoleId:
                            description: KeptRoleID is the ID of the role that was
                              kept.
                            type: string
                          roleName:
                            description: RoleName is the name shared by all roles
                              in this group.
                            type: string
                        required:
                        - count
                        - roleName
                        type: object
                      type: array
                    rolesDeleted:
                      description: RolesDeleted is the count of roles deleted in this
                        guild (action mode only).
                      type: integer
                    totalChannels:
                      description: TotalChannels is the total number of channels in
                        the guild.
                      type: integer
                    totalRoles:
                      description: TotalRoles is the total number of roles in the
                        guild.
                      type: integer
                    totalWebhooks:
                      description: TotalWebhooks is the total number of webhooks in
                        the guild.
                      type: integer
                    webhookDuplicateGroups:
                      description: WebhookDuplicateGroups contains information about
                        each duplicate webhook group found.
                      items:
                        description: |-
                          WebhookDuplicateGroupInfo contains information about a group of duplicate webhooks.
                          Webhooks have no message-history concept of their own, so keep-selection is always the
                          earliest-created (lowest Discord snowflake ID) webhook - exactly one KeptWebhookID.
                        properties:
                          count:
                            description: Count is the number of duplicate webhooks
                              with this name.
                            type: integer
                          deletedWebhookIds:
                            description: DeletedWebhookIDs are the IDs of webhooks
                              that were (or, in report mode, would be) deleted.
                            items:
                              type: string
                            type: array
                          keptWebhookId:
                            description: KeptWebhookID is the ID of the webhook that
                              was kept.
                            type: string
                          webhookName:
                            description: WebhookName is the name shared by all webhooks
                              in this group.
                            type: string
                        required:
                        - count
                        - webhookName
                        type: object
                      type: array
                    webhooksDeleted:
                      description: WebhooksDeleted is the count of webhooks deleted
                        in this guild (action mode only).
                      type: integer
                  required:
                  - channelsDeleted
                  - guildId
                  - guildName
                  - orphanedResourcesDeleted
                  - rolesDeleted
                  - totalChannels
                  - totalRoles
                  - totalWebhooks
                  - webhooksDeleted
                  type: object
                description: Results contains per-guild deduplication results.
                type: object
              startTime:
                description: StartTime is when the deduplication operation was initiated.
                format: date-time
                type: string
              summary:
                description: Summary provides aggregate statistics about the deduplication
                  operation.
                properties:
                  channelsDeleted:
                    description: ChannelsDeleted is the count of Discord channels
                      actually deleted (action mode only).
                    type: integer
                  duplicateGroupsFound:
                    description: DuplicateGroupsFound is the number of distinct duplicate
                      channel groups.
                    type: integer
                  orphanedResourcesDeleted:
                    description: OrphanedResourcesDeleted is the count of Crossplane
                      resources deleted (action mode only).
                    type: integer
                  roleDuplicateGroupsFound:
                    description: RoleDuplicateGroupsFound is the number of distinct
                      duplicate role groups.
                    type: integer
                  rolesDeleted:
                    description: RolesDeleted is the count of Discord roles actually
                      deleted (action mode only).
                    type: integer
                  totalChannelsAnalyzed:
                    description: TotalChannelsAnalyzed is the total number of channels
                      examined.
                    type: integer
                  totalDuplicateChannelsFound:
                    description: TotalDuplicateChannelsFound is the total count of
                      duplicate channels (excluding the kept one(s) in each group).
                    type: integer
                  totalDuplicateRolesFound:
                    description: TotalDuplicateRolesFound is the total count of duplicate
                      roles (excluding the kept one in each group).
                    type: integer
                  totalDuplicateWebhooksFound:
                    description: TotalDuplicateWebhooksFound is the total count of
                      duplicate webhooks (excluding the kept one in each group).
                    type: integer
                  totalGuildsAnalyzed:
                    description: TotalGuildsAnalyzed is the number of guilds that
                      were analyzed.
                    type: integer
                  totalRolesAnalyzed:
                    description: TotalRolesAnalyzed is the total number of roles examined.
                    type: integer
                  totalWebhooksAnalyzed:
                    description: TotalWebhooksAnalyzed is the total number of webhooks
                      examined.
                    type: integer
                  webhookDuplicateGroupsFound:
                    description: WebhookDuplicateGroupsFound is the number of distinct
                      duplicate webhook groups.
                    type: integer
                  webhooksDeleted:
                    description: WebhooksDeleted is the count of Discord webhooks
                      actually deleted (action mode only).
                    type: integer
                required:
                - channelsDeleted
                - duplicateGroupsFound
                - orphanedResourcesDeleted
                - roleDuplicateGroupsFound
                - rolesDeleted
                - totalChannelsAnalyzed
                - totalDuplicateChannelsFound
                - totalDuplicateRolesFound
                - totalDuplicateWebhooksFound
                - totalGuildsAnalyzed
                - totalRolesAnalyzed
                - totalWebhooksAnalyzed
                - webhookDuplicateGroupsFound
                - webhooksDeleted
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
